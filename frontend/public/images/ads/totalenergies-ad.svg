<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="teBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f4d" />
      <stop offset="45%" stop-color="#182c6c" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#0b0b0f" />
    </linearGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="teGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#teBg)" />

  <!-- Speed diagonals -->
  <path d="M-100,0 L300,0 L180,300 L-100,300 Z" fill="#ffffff" fill-opacity="0.03" />
  <path d="M400,0 L850,0 L700,300 L250,300 Z" fill="#ffffff" fill-opacity="0.02" />
  
  <!-- Right Trophy Graphic Illumination -->
  <circle cx="1060" cy="150" r="160" fill="#EF233C" fill-opacity="0.2" filter="url(#teGlow)" />
  <circle cx="1060" cy="150" r="110" fill="#F59E0B" fill-opacity="0.15" />

  <!-- Trophy Icon Silhouette -->
  <g transform="translate(1015, 75)" fill="url(#goldTrophy)">
    <!-- Cup -->
    <path d="M20,10 L70,10 L70,55 C70,75 55,90 45,95 C35,90 20,75 20,55 Z" />
    <!-- Handles -->
    <path d="M12,20 C5,20 0,30 0,42 C0,55 10,65 20,65 L20,55 C15,55 8,48 8,42 C8,35 12,28 16,28 Z" />
    <path d="M78,20 C85,20 90,30 90,42 C90,55 80,65 70,65 L70,55 C75,55 82,48 82,42 C82,35 78,28 74,28 Z" />
    <!-- Stem & Base -->
    <rect x="40" y="95" width="10" height="25" />
    <rect x="25" y="120" width="40" height="15" rx="3" />
    <!-- Star on cup -->
    <polygon points="45,35 48,43 56,43 50,48 52,56 45,51 38,56 40,48 34,43 42,43" fill="#ffffff" />
  </g>

  <!-- Left Content -->
  <!-- TotalEnergies Logo Emblem -->
  <g transform="translate(50, 42)">
    <rect width="64" height="64" rx="16" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.2" />
    <path d="M22,24 C22,20 28,16 34,16 C42,16 46,22 44,30 C42,38 34,44 26,44" fill="none" stroke="#EF233C" stroke-width="4" stroke-linecap="round" />
    <path d="M28,34 C30,30 36,26 42,28 C46,30 48,36 46,42 C44,48 36,50 30,48" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
    <circle cx="34" cy="34" r="5" fill="#F59E0B" />
  </g>

  <g transform="translate(130, 55)">
    <rect width="210" height="26" rx="6" fill="#EF233C" fill-opacity="0.3" stroke="#EF233C" stroke-width="1" />
    <text x="14" y="17" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="11" fill="#fca5a5" letter-spacing="1.5">TITLE CONTINENTAL SPONSOR</text>
  </g>

  <text x="130" y="122" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="33" fill="#ffffff" letter-spacing="-0.5">
    TOTALENERGIES CAF CHAMPIONS LEAGUE
  </text>

  <text x="130" y="162" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="20" fill="url(#goldTrophy)">
    FUELING AFRICAN FOOTBALL PASSION ACROSS 54 NATIONS
  </text>

  <text x="130" y="198" font-family="Arial, sans-serif" font-weight="500" font-size="15" fill="#e2e8f0">
    Enter the Energy of Africa Challenge. Win all-inclusive VIP Matchday Experiences in Cairo &amp; Pretoria.
  </text>

  <!-- CTA Button Graphic -->
  <g transform="translate(130, 216)">
    <rect width="210" height="44" rx="14" fill="#EF233C" filter="url(#teGlow)" />
    <rect width="210" height="44" rx="14" fill="#EF233C" />
    <text x="85" y="28" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">ENTER VIP DRAW</text>
    <path d="M165,22 L175,22 M171,18 L175,22 L171,26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

</svg>
