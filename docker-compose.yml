services:
  mysql:
    image: mysql:8.0
    container_name: sportsarena_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sportsarenaafrika}
      MYSQL_USER: ${DB_USER:-arena_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
    - sportsarena_net
  redis:
    image: redis:7-alpine
    container_name: sportsarena_redis
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a $${REDIS_PASSWORD} ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - sportsarena_net
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportsarena_backend_1
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &id001
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-sportsarenaafrika}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-arena_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sportsarenaafrika.com,https://www.sportsarenaafrika.com}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-sportsarena-media}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://media.sportsarenaafrika.com}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Sports Arena Administrator}
    ports:
    - 127.0.0.1:18081:8080
    volumes:
    - uploads_data:/app/uploads
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/actuator/health | grep -q 'UP'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
    - sportsarena_net
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportsarena_backend_2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend_1:
        condition: service_healthy
    environment: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/actuator/health | grep -q 'UP'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
    - sportsarena_net
    ports:
    - 127.0.0.1:18082:8080
    volumes:
    - uploads_data:/app/uploads
volumes:
  mysql_data: null
  redis_data: null
  uploads_data: null
networks:
  sportsarena_net:
    driver: bridge
