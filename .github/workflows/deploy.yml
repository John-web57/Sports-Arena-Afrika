name: Build name: Build & Deploy CI/CD Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-frontend:
    name: Build Frontend PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Build Production PWA Bundle
        run: npm run lint && npm run build

      - name: Verify PWA Assets
        run: |
          test -f dist/manifest.json || exit 1
          test -f dist/sw.js || exit 1
          test -f dist/offline.html || exit 1
          echo "All PWA assets verified successfully!"

  build-backend:
    name: Build Backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Test with Maven
        run: mvn clean verify
